name: Build Match Prediction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check project files
        run: |
          test -f package.json
          test -f index.html
          test -f App.tsx
          test -f vite.config.ts

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: match-prediction-web-build
          path: dist/
          
