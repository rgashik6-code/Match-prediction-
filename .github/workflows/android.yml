name: Build Match Prediction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
         

      - name: Check project files
        run: |
          test -f package.json
          test -f index.html
          test -f App.tsx
          test -f vite.config.ts

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: match-prediction-web-build
          path: dist/
          
