name: Build GoalPredict Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          bun install
          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli

      - name: Build web app
        run: bun run build

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.rgashik6code.goalpredict',
            appName: 'GoalPredict',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Android project
        run: bunx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalPredict-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
